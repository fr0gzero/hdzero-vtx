name: hdzero-vtx build
on: [push, pull_request]
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: set-targets
        run: echo "targets=[$(grep -r "\[env:" targets/*.ini | sed 's/.*:\(.*\)].*/"\1"/' | tr '\n' ',')]" >> $GITHUB_OUTPUT

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{fromJSON(needs.targets.outputs.targets)}}
    runs-on: ubuntu-24.04
    steps:
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.target }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio

      - name: Build
        run: |
          platformio platform update
          platformio platform install native
          rm -rf .pio
          platformio run -e ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: .pio/build/${{ matrix.target }}/HDZERO_TX.bin

  publish:
    # fr0gOS: commit every target's HDZERO_TX.bin to the fr0g-builds branch, so the firmware can be fetched with git
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Commit firmware
        run: |
          cd out
          git init -q -b fr0g-builds
          git config user.name "fr0g-builds"
          git config user.email "builds@users.noreply.github.com"
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git add -A
          git commit -qm "builds of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" fr0g-builds
